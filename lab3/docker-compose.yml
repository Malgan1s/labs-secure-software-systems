# Docker Compose описывает, как запустить несколько контейнеров вместе.
# Здесь их два (они называются сервисами): db — PostgreSQL, app — наша программа.
# Compose сам создаёт для них общую сеть lab3_default (по имени папки lab3).
# В этой сети контейнеры находят друг друга по имени сервиса: db и app.
#
# Основные команды (выполнять в папке lab3):
#   docker compose up -d db      — запустить базу в фоне
#   docker compose ps            — посмотреть статус контейнеров
#   docker compose run --rm app  — запустить программу в интерактивном режиме
#   docker compose down          — остановить всё, данные сохраняются
#   docker compose down -v       — остановить и удалить данные (тома)

services:
  # Сервис базы данных. Имя сервиса db — это и есть адрес базы внутри сети:
  # в app/config.json написано "host": "db".
  db:
    # build — собрать образ из папки ./db (там Dockerfile и SQL-скрипты)
    build: ./db
    # image — какое имя и тег дать собранному образу
    image: rzps-autoservice-db:1.0
    # environment — переменные среды для контейнера.
    # POSTGRES_PASSWORD — пароль администратора postgres. Его требует официальный
    # образ при первом запуске. Значение учебное: программа под postgres не работает,
    # она подключается как app_user.
    environment:
      POSTGRES_PASSWORD: postgres_demo_password
    # volumes — где хранить данные. db_data — именованный том Docker: данные базы
    # переживают остановку и пересоздание контейнера, удаляет их только down -v.
    # /var/lib/postgresql — папка, где PostgreSQL 18 хранит данные внутри контейнера.
    volumes:
      - db_data:/var/lib/postgresql
    # Раздела ports нет: порт 5432 наружу не публикуем. К базе ходит только
    # программа внутри сети Docker, с компьютера напрямую к ней не подключиться.
    # healthcheck — как Docker проверяет, что база готова принимать подключения.
    # pg_isready -h 127.0.0.1 спрашивает сервер по сети (TCP). Пока выполняются
    # SQL-скрипты первого запуска, PostgreSQL по сети не отвечает, поэтому статус
    # станет healthy, только когда скрипты закончат работу.
    healthcheck:
      # test — команда проверки, выполняется внутри контейнера db
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      # interval — проверять каждые 5 секунд
      interval: 5s
      # timeout — сколько ждать ответа на одну проверку
      timeout: 3s
      # retries — после 20 неудачных проверок подряд статус станет unhealthy
      retries: 20

  # Сервис программы autoservice.py
  app:
    # build — как собрать образ, если его ещё нет (папка ./app с Dockerfile).
    # Обычно мы собираем его заранее: docker build -t rzps-autoservice:1.0 ./app
    build: ./app
    # image — тегированный образ программы, Compose запускает именно его
    image: rzps-autoservice:1.0
    # env_file — путь до env-файла (пункт задания). Compose читает app.env
    # и передаёт переменные из него в контейнер; программа берёт LOG_FILE
    # через os.environ.get("LOG_FILE").
    env_file:
      - ./app.env
    # app_logs — именованный том, подключённый в папку /logs контейнера.
    # Туда программа пишет лог-файл, и он сохраняется после выхода из программы.
    volumes:
      - app_logs:/logs
    # depends_on — запускать программу только после того, как db станет healthy
    depends_on:
      db:
        condition: service_healthy
    # Интерактивный режим, как ключи -i и -t у docker run:
    # stdin_open — держать ввод открытым, чтобы программа читала с клавиатуры;
    # tty — выделить терминал, чтобы работали подсказки и скрытый ввод пароля.
    stdin_open: true
    tty: true

# Объявление именованных томов, которые используются выше.
# Docker создаёт их при первом запуске и называет lab3_db_data и lab3_app_logs.
volumes:
  db_data:
  app_logs:
